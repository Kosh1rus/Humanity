- type: htnCompound
  id: PredatorActivityCompound
  branches:
  - tasks:
    - !type:HTNCompoundTask
      task: PredatorAttackCompound
  - preconditions:
    - !type:BaseSatiationPrecondition
      satiationType: Hunger
      below: Peckish
    tasks:
    - !type:HTNCompoundTask
      task: PredatorHuntCompound
  - tasks:
    - !type:HTNCompoundTask
      task: IdleCompound
- type: htnCompound
  id: PredatorAttackCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: NearbyPrey
    - !type:HTNCompoundTask
      task: PredatorWarnCompound
  - preconditions:
    - !type:KeyExistsPrecondition
      key: Target
    tasks:
    - !type:HTNCompoundTask
      task: PredatorMeleeCombatCompound
- type: htnCompound
  id: PredatorHuntCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:PickAccessibleOperator
        rangeKey: HuntRange
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: false
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: NearbyPrey
- type: htnCompound
  id: PredatorWarnCompound
  branches:
  - preconditions:
    - !type:KeyExistsPrecondition
      key: Target
    - !type:TargetInRangePrecondition
      targetKey: Target
      rangeKey: VisionRadius
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:SpeakOperator
        speech: !type:SingleSpeakOperatorSpeech
          line: humanity-fauna-growl
        hidden: false
    - !type:HTNPrimitiveTask
      operator: !type:SetFloatOperator
        targetKey: WaitTime
        amount: 3
    - !type:HTNPrimitiveTask
      operator: !type:WaitOperator
        key: WaitTime
- type: htnCompound
  id: PredatorMeleeCombatCompound
  branches:
  - preconditions:
    - !type:KeyExistsPrecondition
      key: Target
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        shutdownState: PlanFinished
        pathfindInPlanning: true
        removeKeyOnFinish: false
        targetKey: Target
        rangeKey: MeleeRange
    - !type:HTNPrimitiveTask
      operator: !type:JukeOperator
        jukeType: AdjacentTile
    - !type:HTNPrimitiveTask
      operator: !type:MeleeOperator
        targetKey: Target
      preconditions:
      - !type:TargetInRangePrecondition
        targetKey: Target
        rangeKey: MeleeRange
- type: utilityQuery
  id: NearbyPrey
  query:
  - !type:NearbyHostilesQuery ''
  considerations:
  - !type:TargetIsAliveCon
    curve: !type:BoolCurve ''
  - !type:TargetDistanceCon
    curve: !type:PresetCurve
      preset: PreyDistance
  - !type:TargetHealthCon
    curve: !type:PresetCurve
      preset: TargetHealth
  - !type:TargetAccessibleCon
    curve: !type:BoolCurve ''
- type: utilityCurvePreset
  id: PreyDistance
  curve: !type:QuadraticCurve
    slope: -1
    exponent: 1
    yOffset: 1
    xOffset: 0
