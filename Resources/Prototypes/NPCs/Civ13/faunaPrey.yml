- type: htnCompound
  id: SimplePreyCompound
  branches:
  - tasks:
    - !type:HTNCompoundTask
      task: PreyFleeCompound
  - preconditions:
    - !type:BaseSatiationPrecondition
      satiationType: Hunger
      below: Peckish
    tasks:
    - !type:HTNCompoundTask
      task: PreyForageCompound
  - tasks:
    - !type:HTNCompoundTask
      task: PreyIdleCompound
- type: htnCompound
  id: PreyFleeCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:UtilityOperator
        proto: NearbyHostiles
    - !type:HTNCompoundTask
      task: FleeHostileCompound
- type: htnCompound
  id: PreyForageCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:PickAccessibleOperator
        rangeKey: ForageRange
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: false
    - !type:HTNPrimitiveTask
      operator: !type:RandomOperator
        targetKey: ForageTime
        minKey: MinimumForageTime
        maxKey: MaximumForageTime
    - !type:HTNPrimitiveTask
      operator: !type:WaitOperator
        key: ForageTime
- type: htnCompound
  id: PreyIdleCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:WaitOperator
        key: IdleTime
      preconditions:
      - !type:KeyExistsPrecondition
        key: IdleTime
  - preconditions:
    - !type:BuckledPrecondition
      isBuckled: false
    - !type:PulledPrecondition
      isPulled: false
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:PickAccessibleOperator
        rangeKey: IdleRange
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        pathfindInPlanning: false
    - !type:HTNPrimitiveTask
      operator: !type:PickRandomRotationOperator
        targetKey: RotateTarget
    - !type:HTNPrimitiveTask
      operator: !type:RotateToTargetOperator
        targetKey: RotateTarget
    - !type:HTNPrimitiveTask
      operator: !type:RandomOperator
        targetKey: IdleTime
        minKey: MinimumIdleTime
        maxKey: MaximumIdleTime
    - !type:HTNPrimitiveTask
      operator: !type:WaitOperator
        key: IdleTime
- type: htnCompound
  id: FleeHostileCompound
  branches:
  - preconditions:
    - !type:KeyExistsPrecondition
      key: Target
    - !type:TargetInLOSPrecondition
      targetKey: Target
      rangeKey: VisionRadius
      opaqueKey: false
    tasks:
    - !type:HTNPrimitiveTask
      operator: !type:SpeakOperator
        speech: !type:SingleSpeakOperatorSpeech
          line: humanity-fauna-flee
        hidden: false
    - !type:HTNPrimitiveTask
      operator: !type:JukeOperator
        jukeType: Away
- type: utilityQuery
  id: NearbyHostiles
  query:
  - !type:NearbyHostilesQuery ''
  considerations:
  - !type:TargetIsAliveCon
    curve: !type:BoolCurve ''
  - !type:TargetDistanceCon
    curve: !type:PresetCurve
      preset: HostileDistance
  - !type:TargetHealthCon
    curve: !type:PresetCurve
      preset: TargetHealth
  - !type:TargetAccessibleCon
    curve: !type:BoolCurve ''
- type: utilityCurvePreset
  id: HostileDistance
  curve: !type:QuadraticCurve
    slope: -1
    exponent: 1
    yOffset: 1
    xOffset: 0
