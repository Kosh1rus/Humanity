- type: entity
  id: ClothingSatchelMedical
  parent: ClothingBeltStorageBase
  name: медицинская сумка
  description: Сумка с разнообразными медицинскими принадлежностями.
  components:
    - type: Sprite
      sprite: Civ14/Objects/Storage/medical_satchel.rsi
    - type: Clothing
      sprite: Civ14/Objects/Storage/medical_satchel.rsi
    - type: STWeight
      self: 1
    - type: Item
      size: Large
    - type: Storage
      maxItemSize: Normal
      grid:
        - 0,0,8,1

- type: entity
  id: ClothingSatchelMedicalFilled
  parent: ClothingSatchelMedical
  name: медицинская сумка
  description: Сумка с разнообразными медицинскими принадлежностями.
  suffix: filled
  components:
    - type: StorageFill
      contents:
        - id: DoctorsHandbook
          amount: 1
        - id: Brutepack
          amount: 2
        - id: Ointment
          amount: 2
        - id: Gauze
          amount: 2
        - id: ClothingHandsGlovesNitrile

- type: entity
  id: ClothingSatchelMedicalMedsFilled
  parent: ClothingSatchelMedical
  name: медицинская сумка
  description: Сумка с разнообразными медицинскими принадлежностями.
  suffix: filled, meds
  components:
    - type: StorageFill
      contents:
        - id: SyretteAdrenaline
          amount: 4
        - id: SyretteMorphine
          amount: 4
        - id: PillCanisterSulfanilamide
          amount: 2

- type: entity
  id: ClothingSatchelMedkit
  parent: ClothingSatchelMedical
  name: медицинский набор
  description: Набор разнообразных медицинских принадлежностей.
  components:
    - type: Sprite
      sprite: Civ14/Objects/Storage/medkit.rsi
    - type: Clothing
      sprite: Civ14/Objects/Storage/medkit.rsi
    - type: Item
      size: Small
    - type: Storage
      maxItemSize: Normal
      grid:
        - 0,0,4,1

# this is actually a backpack

- type: entity
  parent: ClothingBackpackDuffel
  id: BackpackMedicalBag
  name: медицинская дорожная сумка
  description: Большая сумка с медицинскими принадлежностями.
  components:
    - type: Sprite
      sprite: Civ14/Objects/Storage/medical_bag.rsi
    - type: Clothing
      sprite: Civ14/Objects/Storage/medical_bag.rsi
    - type: Storage
      maxItemSize: Huge
      grid:
        - 0,0,7,4

- type: entity
  id: ClothingBackpackDuffelFilled
  parent: BackpackMedicalBag
  name: медицинская дорожная сумка
  suffix: filled
  components:
    - type: StorageFill
      contents:
        - id: DoctorsHandbook
          amount: 1
        - id: Brutepack
          amount: 2
        - id: Ointment
          amount: 2
        - id: Bloodpack
          amount: 2
        - id: Gauze
          amount: 4
        - id: ClothingHandsGlovesLatex
