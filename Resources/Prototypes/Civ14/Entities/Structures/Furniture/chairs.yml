- type: entity
  name: деревянный стул
  id: ChairWoodCiv
  parent: UnanchoredChairBase
  components:
    - type: Sprite
      sprite: Civ14/Objects/bed_chair.rsi
      state: wooden_chair_alt
    - type: Damageable
      damageModifierSet: Wood
    - type: Destructible
      thresholds:
        - trigger: !type:DamageTrigger
            damage: 25
          behaviors:
            - !type:DoActsBehavior
              acts: ["Destruction"]
            - !type:PlaySoundBehavior
              sound:
                collection: WoodDestroy
            - !type:SpawnEntitiesBehavior
              spawn:
                MaterialWoodPlank:
                  min: 1
                  max: 1
    - type: Tag
      tags:
        - Wooden
    - type: StaticPrice
      price: 75

