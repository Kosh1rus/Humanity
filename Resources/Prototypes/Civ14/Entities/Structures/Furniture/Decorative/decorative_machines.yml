  id: StructureDecorativeMachines
  name: армейская радиостанция
  description: Армейская радиостанция.
  suffix: decorative
  abstract: true
  components:
  - type: Sprite
    noRot: true
    sprite: Civ14/Objects/device.rsi
    state: modern_intercom
  - type: Damageable
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
