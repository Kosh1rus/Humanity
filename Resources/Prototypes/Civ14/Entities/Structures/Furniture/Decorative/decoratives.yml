      state: cone
      layers:
        - state: cone
          map: ["random"]
    - type: RandomSprite
      available:
        - random:
            cone: ""
            cone1: ""
            cone2: ""
    - type: STWeight
      self: 0.75
    - type: Item
      size: Normal
