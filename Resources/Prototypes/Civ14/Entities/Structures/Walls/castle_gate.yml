- type: entity
  id: CastleGate
  description: Замковые ворота из металлических прутьев.
  parent: BaseBarricade
  name: замковые ворота
  placement:
    mode: SnapgridCenter
  components:
  - type: InteractionOutline
  - type: Sprite
    sprite: Civ14/Structures/Doors/doors_64x32.rsi
    state: gate_large_closed
    drawdepth: Overdoors
    noRot: true
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        density: 1000
        shape: !type:PhysShapeAabb
          bounds: -1.49,-0.49,1.49,0.49
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: Damageable
    damageModifierSet: Rock
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts:
        - Destruction
  - type: Barricade
    blocking: 80
  - type: AtmosExposed
  - type: Injurable
    damageContainer: StructuralInorganic
