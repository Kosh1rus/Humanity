- type: entity
  parent: BaseWall
  id: StrawWall
  name: соломенная стена
  description: Простая стена из соломы и сухих листьев. Легко загорается.
  components:
  - type: MeleeSound
    soundGroups:
      Brute:
        path: /Audio/Weapons/boxingpunch1.ogg
  - type: Tag
    tags:
    - Wooden
    - Wall
  - type: Sprite
    sprite: Civ14/Structures/Walls/straw.rsi
  - type: Icon
    sprite: Civ14/Structures/Walls/straw.rsi
  - type: IconSmooth
    key: walls
    states:
    - !type:CornerSpriteSmoothing
      base: straw
      mask: [walls, windows, grilles, marble, doors]
  - type: Damageable
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 65
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialStraw:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts:
        - Destruction
  - type: Construction
    agemin: 0
    agemax: 8
    graph: StrawWall
    node: end
    cost: 5
    time: 8
    material: Straw
  - type: Injurable
    damageContainer: StructuralInorganic
