- type: entity
  parent: BaseRailing
  id: BaseCivWindow
  name: "окно"
  description: "Обычное окно."
  abstract: true
  components:
    - type: Sprite
      drawdepth: SmallObjects
      sprite: Civ14/Structures/windows.rsi
      state: drysod_window
    - type: Icon
      sprite: Civ14/Structures/windows.rsi
      state: drysod_window
    - type: IsRoof
    - type: Climbable
    - type: Fixtures
      fixtures:
        fix1:
          shape: !type:PhysShapeAabb
            bounds: "-0.49,-0.49,0.49,0.49"
          density: 1000
          mask:
            - TableMask
          layer:
            - LowImpassable
    - type: Damageable
      damageContainer: StructuralInorganic
      damageModifierSet: Wood
    - type: Destructible
      thresholds:
        - trigger: !type:DamageTrigger
            damage: 90
          behaviors:
            - !type:DoActsBehavior
              acts: ["Destruction"]

- type: entity
  parent: BaseCivWindow
  id: DirtWallWindow
  name: "окно в глинобитной стене"
  description: "Стена из высушенных глиняных кирпичей с окном."
  components:
    - type: Sprite
      drawdepth: SmallObjects
      sprite: Civ14/Structures/windows.rsi
      state: drysod_window
    - type: Icon
      sprite: Civ14/Structures/windows.rsi
      state: drysod_window
    - type: Construction
      agemin: 0
      agemax: 8
      node: end

