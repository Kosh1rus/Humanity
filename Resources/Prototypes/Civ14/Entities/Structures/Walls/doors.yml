- type: entity
  id: WoodDoorRustic
  name: деревенская деревянная дверь
  parent: WoodDoor
  description: Простая деревянная дверь в деревенском стиле.
  components:
  - type: Sprite
    sprite: Civ14/Structures/Doors/wood_door_rustic.rsi
    layers:
    - state: closed
      map:
      - enum.DoorVisualLayers.Base
  - type: Door
    changeAirtight: false
  - type: Airtight
    airBlocked: false
  - type: Construction
    agemin: 0
    agemax: 8
    graph: WoodDoorRustic
    node: end
- type: entity
  id: WoodDoorClassic
  name: деревянная дверь
  parent: WoodDoor
  description: Обычная деревянная дверь.
  components:
  - type: Sprite
    sprite: Civ14/Structures/Doors/wood_door_classic.rsi
    layers:
    - state: closed
      map:
      - enum.DoorVisualLayers.Base
  - type: Door
    changeAirtight: false
  - type: Airtight
    airBlocked: false
  - type: Construction
    agemin: 0
    agemax: 8
    graph: WoodDoorClassic
    node: end
- type: entity
  id: CellDoor
  name: решётчатая дверь
  parent: BaseMaterialDoor
  description: Дверь из металлических прутьев.
  components:
  - type: InteractionOutline
  - type: Sprite
    sprite: Civ14/Structures/Doors/cell_doors.rsi
    layers:
    - state: closed
      map:
      - enum.DoorVisualLayers.Base
  - type: AnimationPlayer
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: -0.49,-0.49,0.49,0.49
        density: 100
        layer:
        - AirlockLayer
  - type: Door
    occludes: false
    bumpOpen: false
    clickOpen: true
    canCrush: false
    closeTimeOne: 0.2
    closeTimeTwo: 0.6
    openTimeOne: 0.6
    openTimeTwo: 0.2
    openingAnimationTime: 1.2
    closingAnimationTime: 1.2
    openSound:
      path: /Audio/Effects/metal_scrape2.ogg
    closeSound:
      path: /Audio/Effects/metal_scrape3.ogg
  - type: Appearance
  - type: Damageable
    damageModifierSet: Metallic
  - type: IconSmooth
    key: walls
    mode: NoSprite
  - type: Barricade
    bidirectional: true
    blocking: 0
  - type: Occluder
    enabled: false
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts:
        - Destruction
  - type: Injurable
    damageContainer: StructuralInorganic
- type: entity
  id: MetalHeavyDoor
  name: тяжёлая металлическая дверь
  parent: BaseMaterialDoor
  components:
  - type: Sprite
    sprite: Civ14/Structures/Doors/metal_doors.rsi
    layers:
    - state: closed
      map:
      - enum.DoorVisualLayers.Base
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts:
        - Destruction
