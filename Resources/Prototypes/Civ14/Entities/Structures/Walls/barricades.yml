- type: entity
  id: CrenelatedWall
  description: Каменная стена с зубцами для укрытия защитников.
  parent: BaseBarricade
  name: зубчатая стена
  placement:
    mode: SnapgridCenter
  components:
  - type: InteractionOutline
  - type: Sprite
    sprite: Civ14/Structures/barricades.rsi
    state: crenelated_wall
    drawdepth: FloorObjects
    noRot: true
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: -0.49,-0.45,0.49,-0.02
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: Damageable
    damageModifierSet: Rock
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:DoActsBehavior
        acts:
        - Destruction
  - type: Barricade
    bidirectional: false
    blocking: 85
  - type: AtmosExposed
  - type: Injurable
    damageContainer: StructuralInorganic
