- type: entity
  name: capturable area
  id: MarkerCapturableArea
  parent: MarkerBase
  abstract: true
  components:
    - type: Sprite
      sprite: Civ14/Markers/areas.rsi
      state: capture_red
    - type: CaptureArea
      name: "Основная точка"
      captureDuration: 300 # 5 min
      captureRadius: 6
      contestedResetTime: 10 # 10 seconds before timer resets when contested

- type: entity
  name: capturable area - KOTH Camp
  id: MarkerKOTHCamp
  parent: MarkerCapturableArea
  components:
    - type: Sprite
      sprite: Civ14/Markers/areas.rsi
      state: capture_green
    - type: CaptureArea
      name: "Замок"
      captureDuration: 240 # 4 min
      captureRadius: 6
      contestedResetTime: 10 # 10 seconds before timer resets when contested
      capturableFactions:
        - England
        - France

- type: entity
