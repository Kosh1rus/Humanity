- type: entity
  parent: ClothingBackpack
  id: LeatherClothingBackpack
  name: кожаный рюкзак
  description: Прочный рюкзак из кожи.
  components:
  - type: Sprite
    sprite: Civ14/Objects/Storage/backpack.rsi
  - type: Construction
    graph: LeatherClothingBackpack
    node: end
    agemin: 0
    agemax: 8
- type: entity
  parent: ClothingBeltStorageBase
  id: LeatherClothingBelt
  name: кожаная поясная сумка
  description: Кожаная сумка, которую носят на поясе.
  components:
  - type: Sprite
    sprite: Civ14/Objects/Storage/satchel.rsi
  - type: Construction
    graph: LeatherClothingBelt
    node: end
    agemin: 0
    agemax: 8
- type: entity
  parent: BaseItem
  id: LeatherWaterskin
  name: кожаный бурдюк
  description: Бурдюк из кожи для хранения и переноски жидкостей.
  components:
  - type: Sprite
    sprite: Civ14/Objects/Storage/storage.rsi
    state: waterskin
  - type: STWeight
    self: 2
  - type: Item
    size: Normal
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 100
  - type: SolutionTransfer
    canChangeTransferAmount: true
    maxTransferAmount: 5
  - type: Edible
    solution: drink
    destroyOnEmpty: false
    utensil: None
  - type: MeleeWeapon
    soundNoDamage:
      path: /Audio/Effects/Fluids/splat.ogg
    damage:
      types:
        Blunt: 0
  - type: MixableSolution
    solution: drink
  - type: Spillable
    solution: drink
  - type: FitsInDispenser
    solution: drink
  - type: DrawableSolution
    solution: drink
  - type: RefillableSolution
    solution: drink
  - type: DrainableSolution
    solution: drink
  - type: UserInterface
    interfaces:
      enum.TransferAmountUiKey.Key:
        type: TransferAmountBoundUserInterface
  - type: Construction
    graph: LeatherWaterskin
    node: end
    agemin: 0
    agemax: 8
