- type: entity
  name: граната Stielhandgranate 24
  description: Немецкая осколочная граната времён Второй мировой войны.
  parent: TimerGrenadeBase
  id: GrenadeSHG24
  components:
  - type: Explosive
    explosionType: CivGrenade
    maxIntensity: 5
    intensitySlope: 2
    totalIntensity: 30
    canCreateVacuum: false
  - type: TimerTrigger
    delay: 3
  - type: ProjectileGrenade
    fillPrototype: PelletClusterLethal
    capacity: 15
  - type: ContainerContainer
    containers:
      cluster-payload: !type:Container ''
  - type: TwoStageTrigger
    triggerDelay: 0
    components:
    - type: ExplodeOnTrigger
      keysIn:
      - stageTwo
    keysIn:
    - timer
    keyOut: stageTwo
  - type: Sprite
    sprite: Civ14/Objects/grenade.rsi
    layers:
    - state: stgnade
      map:
      - enum.TriggerVisualLayers.Base
  - type: GenericVisualizer
    visuals:
      enum.Trigger.TriggerVisuals.VisualState:
        enum.ConstructionVisuals.Layer:
          Primed:
            state: stgnade_active
          Unprimed:
            state: stgnade
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:TriggerBehavior ''
      - !type:DoActsBehavior
        acts:
        - Destruction
  - type: TriggerOnUse
