# smoke

- type: entity
  parent: GrenadeBase
  id: SmokeGrenadeRDG2
  name: дымовая граната РДГ-2
  description: Создаёт большое и долго не рассеивающееся облако дыма.
  components:
    - type: Sprite
      sprite: Civ14/Objects/Grenades/rdg2.rsi
      state: rdg2_yellow
    - type: SmokeOnTrigger
      duration: 25
      spreadAmount: 30
    - type: SoundOnTrigger
      sound: /Audio/Items/smoke_grenade_smoke.ogg
    - type: DeleteOnTrigger

