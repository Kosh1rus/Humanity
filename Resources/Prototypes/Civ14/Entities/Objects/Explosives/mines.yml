- type: entity
  name: "мина"
  parent: LandMineExplosive
  id: LandMineCiv
  components:
    - type: Explosive
      explosionType: CivDefault
    - type: Sprite
      drawdepth: Items
      sprite: Civ14/Objects/grenade.rsi
      state: mine_armed
    - type: LandMine
      sound:
        path: /Audio/Weapons/Guns/Cock/shotgun_open.ogg # yes, this is the right sound
        params:
          maxDistance: 10

- type: entity
  name: "мина-ловушка"
  description: "Замаскированный взрывной заряд."
  parent: LandMineCiv
  id: LandMineBoobyTrap
  components:
    - type: Sprite
      drawdepth: Items
      sprite: Civ14/Objects/grenade.rsi
      state: boobytrap_armed
    - type: Explosive
      explosionType: CivDefault
      maxIntensity: 5
      intensitySlope: 2
      totalIntensity: 30
      canCreateVacuum: false
    - type: ProjectileGrenade
      fillPrototype: PelletClusterLethal
      capacity: 15
    - type: ContainerContainer
      containers:
        cluster-payload: !type:Container
