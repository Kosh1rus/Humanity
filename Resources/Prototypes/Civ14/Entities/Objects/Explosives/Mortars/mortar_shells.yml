- type: entity
  abstract: true
  parent: BaseItem
  id: MortarAmmoBase
  name: base mortar shell
  components:
    - type: Sprite
      sprite: Civ14/Objects/Mortars/shells.rsi
      state: mortar_ammo_he
    - type: Item
      size: Huge
    - type: MortarShell

- type: entity
  parent: MortarAmmoBase
  id: MortarShellHE
  name: "фугасная миномётная мина"
  description: "Миномётная мина с мощным взрывчатым зарядом. Для выстрела опустите её в ствол миномёта."
  components:
    - type: Item
    - type: Sprite
      sprite: Civ14/Objects/Mortars/shells.rsi
      state: mortar_ammo_he
    - type: MortarShell
    - type: Explosive
      explosionType: CivDefault
      maxIntensity: 10 # these values need tuning to im sure
      intensitySlope: 3
      totalIntensity: 120
      canCreateVacuum: false
      deleteAfterExplosion: true
