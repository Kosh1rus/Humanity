- type: entity
  name: дикорастущее растение
  parent: BaseStructure
  abstract: true
  id: WildPlantBase
  description: Небольшая заросль дикого растения. По неровным листьям видно сходство с культурными сортами, хотя здесь оно
    растёт само по себе.
  suffix: Structure
  components:
  - type: Gatherable
    gatherTime: 0.45
    gatherOffset: 0.18
    toolWhitelist:
      components:
      - Hands
  - type: SoundOnGather
    sound:
      path: /Audio/Effects/plant_rustle.ogg
      params:
        volume: -7
        variation: 0.15
  - type: Clickable
    bounds:
      all: -0.42,-0.48,0.42,0.4
  - type: InteractionOutline
  - type: Sprite
    drawdepth: SmallObjects
    noRot: true
  - type: FoliageAtmosphere
    shedLeaves: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: -0.17,0,0.20,0.4
  - type: Transform
    anchored: true
  - type: Damageable
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:DoActsBehavior
        acts:
        - Destruction
  - type: Injurable
    damageContainer: StructuralInorganic
- type: entity
  name: дикорастущее растение
  parent: WildPlantBase
  id: WildPlantPotato
  components:
  - type: Sprite
    sprite: Humanity/Flora/wild_plants.rsi
    state: potato
  - type: Gatherable
    toolWhitelist:
      components:
      - Hands
    loot:
      All: !type:NestedSelector
        tableId: PotatoWildHarvest
- type: entityTable
  id: PotatoWildHarvest
  table: !type:AllSelector
    children:
    - id: FoodPotato
    - id: PotatoSeedsCiv
