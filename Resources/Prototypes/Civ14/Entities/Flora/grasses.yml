# Yes we have decals for this, but you cannot hide under a decal can you???
- type: entity
  name: высокая трава
  id: WildPlantTallGrass
  description: Густая высокая трава. Похоже, здесь можно спрятаться.
  components:
    - type: Sprite
      sprite: Civ14/Flora/bushes_dry.rsi
      state: tall_grass_3
      drawdepth: Overdoors
    - type: SpriteFade
    - type: Clickable
    - type: Physics
      bodyType: Static
    - type: Fixtures
      fixtures:
        fix1:
          shape: !type:PhysShapeAabb
            bounds: "-0.17,0,0.20,0.4"
    - type: Transform
      anchored: true
    - type: Damageable
      damageContainer: StructuralInorganic
      damageModifierSet: Wood
    - type: Destructible
      thresholds:
        - trigger: !type:DamageTrigger
            damage: 20
          behaviors:
            - !type:DoActsBehavior
              acts: ["Destruction"]
