- type: entity
  name: высокая трава
  id: WildPlantTallGrass
  description: Густая высокая трава. Похоже, здесь можно спрятаться.
  components:
  - type: FoliageAtmosphere
    shedLeaves: false
  - type: Sprite
    sprite: Civ14/Flora/bushes_dry.rsi
    layers:
    - state: tall_grass_3
      shader: HumanityFoliage
    drawdepth: Overdoors
  - type: SpriteFade
  - type: Clickable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: -0.17,0,0.20,0.4
  - type: Transform
    anchored: true
  - type: Damageable
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:DoActsBehavior
        acts:
        - Destruction
  - type: Injurable
    damageContainer: StructuralInorganic
