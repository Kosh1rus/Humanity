- type: entity
  parent: BaseAction
  id: ActionRevertPolymorph
  name: Вернуть облик
  description: Вернуться к первоначальному облику.
  components:
  - type: InstantAction
    event: !type:RevertPolymorphActionEvent ''
- type: entity
  parent: ActionRevertPolymorph
  id: ActionRevertPolymorphConfirm
  components:
  - type: ConfirmableAction
    popup: revert-polymorph-action-popup
- type: entity
  abstract: true
  parent: BaseAction
  id: BaseActionPolymorph
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 60
  - type: InstantAction
    event: !type:PolymorphActionEvent ''
- type: entity
  parent: BaseActionPolymorph
  id: ActionPolymorphWizardSpider
  name: Превратиться в паука
  description: Принять облик паука.
  components:
  - type: Action
  - type: Sprite
    sprite: Mobs/Animals/Spiders/tarantulaspider.rsi
    layers:
    - state: idle
  - type: InstantAction
    event: !type:PolymorphActionEvent
      protoId: WizardSpider
- type: entity
  parent: BaseActionPolymorph
  id: ActionPolymorphWizardRod
  name: Облик стержня
  description: ДЗЫНЬ!
  components:
  - type: Action
  - type: Sprite
    sprite: Objects/Fun/immovable_rod.rsi
    layers:
    - state: icon
  - type: InstantAction
    event: !type:PolymorphActionEvent
      protoId: WizardRod
- type: entity
  parent: BaseActionPolymorph
  id: ActionPolymorphJaunt
  name: Эфирный скачок
  description: Раствориться в эфирном измерении и быстро ускользнуть!
  components:
  - type: Magic
  - type: Action
    useDelay: 30
  - type: Sprite
    sprite: Objects/Magic/magicactions.rsi
    layers:
    - state: jaunt
  - type: InstantAction
    event: !type:PolymorphActionEvent
      protoId: Jaunt
  - type: ActionUpgrade
    effectedLevels:
      2: ActionPolymorphJauntII
      3: ActionPolymorphJauntIII
- type: entity
  parent: ActionPolymorphJaunt
  id: ActionPolymorphJauntII
  name: Эфирный скачок II
  description: Раствориться в эфирном измерении и ускользнуть ещё быстрее!
  components:
  - type: Action
    useDelay: 25
- type: entity
  parent: ActionPolymorphJaunt
  id: ActionPolymorphJauntIII
  name: Эфирный скачок III
  description: Вы вообще ещё материальны?
  components:
  - type: Action
    useDelay: 20
