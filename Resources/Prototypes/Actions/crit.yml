# Actions added to mobs in crit.
- type: entity
  id: ActionCritSuccumb
  name: Сдаться
  description: Принять свою участь.
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    checkCanInteract: false
    checkConsciousness: false
    icon:
      sprite: Mobs/Ghosts/ghost_human.rsi
      state: icon
    event: !type:CritSuccumbEvent
    startDelay: true
    useDelay: 10

- type: entity
  id: ActionCritFakeDeath
  name: Притвориться мёртвым
  description: Изобразить предсмертный вздох и остаться в живых.
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    checkCanInteract: false
    checkConsciousness: false
    icon:
      sprite: Interface/Actions/actions_crit.rsi
      state: fakedeath
    event: !type:CritFakeDeathEvent
    useDelay: 30

- type: entity
  id: ActionCritLastWords
  name: Сказать последние слова
  description: Прошептать прощальные слова тем, кто рядом, и умереть. У вас есть лишь 30 символов.
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    checkCanInteract: false
    checkConsciousness: false
    icon:
      sprite: Interface/Actions/actions_crit.rsi
      state: lastwords
    event: !type:CritLastWordsEvent
    startDelay: true
    useDelay: 10
