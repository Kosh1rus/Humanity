    useDelay: 15

- type: entity
  id: ActionRevenantOverloadLights
  name: Перегрузить освещение
  description: Стоимость — 40 единиц эссенции.
  components:
  - type: InstantAction
    icon: Interface/Actions/overloadlight.png
    event: !type:RevenantOverloadLightsActionEvent
    useDelay: 20

