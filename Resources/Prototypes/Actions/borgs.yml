- type: entity
  parent: BaseMentalAction
  id: ActionViewLaws
  name: Посмотреть законы
  description: Показать законы, которым вы обязаны подчиняться.
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 0.5
  - type: Sprite
    sprite: Interface/Actions/actions_borg.rsi
    layers:
    - state: state-laws
  - type: InstantAction
    event: !type:ToggleLawsScreenEvent ''
- type: entity
  parent: BaseAction
  id: ActionSelectBorgType
  name: Выбрать тип киборга
  components:
  - type: Action
    itemIconStyle: NoItem
    useDelay: 0.5
  - type: Sprite
    sprite: Interface/Actions/actions_borg.rsi
    layers:
    - state: select-type
  - type: InstantAction
    event: !type:BorgToggleSelectTypeEvent ''
