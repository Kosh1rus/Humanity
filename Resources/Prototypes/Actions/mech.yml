- type: entity
  id: ActionMechCycleEquipment
  name: Сменить оборудование
  description: Переключить выбранное оборудование меха.
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    icon:
      sprite: Interface/Actions/actions_mecha.rsi
      state: mech_cycle_equip_on
    event: !type:MechToggleEquipmentEvent
    useDelay: 0.5

- type: entity
  id: ActionMechOpenUI
  name: Панель управления
  description: Открыть панель управления мехом.
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    icon:
      sprite: Interface/Actions/actions_mecha.rsi
      state: mech_view_stats
    event: !type:MechOpenUiEvent
    useDelay: 1

- type: entity
  id: ActionMechEject
  name: Покинуть мех
  description: Высадить пилота из меха.
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    icon:
      sprite: Interface/Actions/actions_mecha.rsi
      state: mech_eject
    event: !type:MechEjectPilotEvent
