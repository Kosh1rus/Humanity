- type: entity
  abstract: true
  id: BaseAction
  components:
  - type: Action
  - type: Sprite
    layers:
    - map:
      - enum.ActionVisuals.Icon
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ActionState.Toggled:
        enum.ActionVisuals.Icon:
          true:
            visible: false
          false:
            visible: true
        enum.ActionVisuals.IconToggled:
          true:
            visible: true
          false:
            visible: false
      enum.LimitedChargesState.HasCharges:
        enum.ActionVisuals.Icon:
          true:
            color: White
          false:
            color: DimGray
        enum.ActionVisuals.IconToggled:
          true:
            color: White
          false:
            color: DimGray
