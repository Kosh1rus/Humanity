# base actions

- type: entity
  id: BaseSuicideAction
  abstract: true
  components:
  - type: ConfirmableAction
    popup: suicide-action-popup

# actions

- type: entity
  id: ActionScream
  name: Кричать
  description: ААААААААААААААААААААААААА
  components:
  - type: InstantAction
    useDelay: 10
    icon: Interface/Actions/scream.png
    event: !type:ScreamActionEvent
    checkCanInteract: false

- type: entity
  id: ActionTurnUndead
  name: Обратиться в зомби
  description: Поддаться инфекции и стать зомби.
  components:
  - type: InstantAction
    checkCanInteract: false
    checkConsciousness: false
    icon: Interface/Actions/zombie-turn.png
    event: !type:ZombifySelfActionEvent

- type: entity
  id: ActionToggleLight
  name: Переключить свет
  description: Включить или выключить свет.
  components:
  - type: InstantAction
    useDelay: 1
    icon: { sprite: Objects/Tools/flashlight.rsi, state: flashlight }
    iconOn: { sprite: Objects/Tools/flashlight.rsi, state: flashlight-on }
    event: !type:ToggleActionEvent

- type: entity
  id: ActionOpenStorageImplant
  name: Переключить имплант-хранилище
  description: Открыть или закрыть встроенное под кожу хранилище.
  components:
  - type: InstantAction
    itemIconStyle: BigAction
    priority: -20
    icon:
      sprite: Clothing/Back/Backpacks/backpack.rsi
      state: icon
    event: !type:OpenStorageImplantEvent
    useDelay: 1

- type: entity
  parent: BaseSuicideAction
  id: ActionActivateMicroBomb
  name: Активировать микробомбу
  description: Взорвать имплантированную микробомбу, уничтожив себя и своё снаряжение.
  components:
  - type: InstantAction
    checkCanInteract: false
    checkConsciousness: false
    itemIconStyle: BigAction
    priority: -20
    icon:
      sprite: Actions/Implants/implants.rsi
      state: explosive
    event: !type:ActivateImplantEvent

- type: entity
  parent: BaseSuicideAction
  id: ActionActivateDeathAcidifier
  name: Активировать кислотный имплант
  description: Запустить имплант, который полностью растворит вас и ваше снаряжение.
  components:
  - type: InstantAction
    checkCanInteract: false
    checkConsciousness: false
    itemIconStyle: BigAction
    priority: -20
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: gib
    event: !type:ActivateImplantEvent

- type: entity
  id: ActionActivateFreedomImplant
  name: Освободиться
  description: Активировать имплант свободы и снять любые путы с рук.
  components:
  - type: InstantAction
    charges: 3
    checkCanInteract: false
    itemIconStyle: BigAction
    priority: -20
    icon:
      sprite: Actions/Implants/implants.rsi
      state: freedom
    event: !type:UseFreedomImplantEvent

- type: entity
  id: ActionOpenUplinkImplant
  name: Открыть аплинк
  description: Открыть аплинк Синдиката, спрятанный под кожей.
  components:
  - type: InstantAction
    itemIconStyle: BigAction
    priority: -20
    icon:
      sprite: Objects/Devices/communication.rsi
      state: old-radio
    event: !type:OpenUplinkImplantEvent

- type: entity
  id: ActionActivateEmpImplant
  name: Активировать ЭМИ
  description: Создать вокруг себя небольшой электромагнитный импульс.
  components:
  - type: InstantAction
    checkCanInteract: false
    charges: 3
    useDelay: 5
    itemIconStyle: BigAction
    priority: -20
    icon:
      sprite: Objects/Weapons/Grenades/empgrenade.rsi
      state: icon
    event: !type:ActivateImplantEvent

- type: entity
  id: ActionActivateScramImplant
  name: Сматываться!
  description: Телепортироваться в случайную точку на большом расстоянии.
  components:
  - type: InstantAction
    checkCanInteract: false
    charges: 2
    useDelay: 5
    itemIconStyle: BigAction
    priority: -20
    icon:
      sprite: Structures/Specific/anomaly.rsi
      state: anom4
    event: !type:UseScramImplantEvent

- type: entity
  id: ActionActivateDnaScramblerImplant
  name: Изменить ДНК
  description: Случайным образом изменить своё имя и внешность.
  components:
  - type: ConfirmableAction
    popup: dna-scrambler-action-popup
  - type: InstantAction
    charges: 1
    itemIconStyle: BigAction
    priority: -20
    icon:
      sprite: Clothing/OuterClothing/Hardsuits/lingspacesuit.rsi
      state: icon
    event: !type:UseDnaScramblerImplantEvent

- type: entity
  id: ActionToggleSuitPiece
  name: Переключить часть костюма
  description: Перед использованием убедитесь, что все важные части костюма надеты.
  components:
  - type: InstantAction
    itemIconStyle: BigItem
    useDelay: 1 # equip noise spam.
    event: !type:ToggleClothingEvent

- type: entity
  id: ActionCombatModeToggle
  name: "[color=red]Боевой режим[/color]"
  description: Перейти в боевой режим.
  components:
  - type: InstantAction
    checkCanInteract: false
    checkConsciousness: false
    icon: Interface/Actions/harmOff.png
    iconOn: Interface/Actions/harm.png
    event: !type:ToggleCombatActionEvent
    priority: -100

- type: entity
  id: ActionCombatModeToggleOff
  parent: ActionCombatModeToggle
  name: "[color=red]Боевой режим[/color]"
  description: Перейти в боевой режим.
  components:
  - type: InstantAction
    enabled: false
    autoPopulate: false
    priority: -100

- type: entity
  id: ActionChangeVoiceMask
  name: Задать имя
  description: Изменить имя, которое слышат окружающие.
  components:
  - type: InstantAction
    icon: { sprite: Interface/Actions/voice-mask.rsi, state: icon }
    event: !type:VoiceMaskSetNameEvent

- type: entity
  id: ActionVendingThrow
  name: Выдать предмет
  description: Выдать случайный предмет из запаса.
  components:
  - type: InstantAction
    useDelay: 30
    event: !type:VendingMachineSelfDispenseEvent

- type: entity
  id: ActionArtifactActivate
  name: Активировать артефакт
  description: Немедленно активировать текущий узел артефакта.
  components:
  - type: InstantAction
    icon:
      sprite: Objects/Specific/Xenoarchaeology/xeno_artifacts.rsi
      state: ano01
    useDelay: 60
    event: !type:ArtifactSelfActivateEvent

- type: entity
  id: ActionToggleBlock
  name: Блокировать
  description: Поднять или опустить щит.
  components:
  - type: InstantAction
    icon: { sprite: Objects/Weapons/Melee/shields.rsi, state: teleriot-icon }
    iconOn: Objects/Weapons/Melee/shields.rsi/teleriot-on.png
    event: !type:ToggleActionEvent

- type: entity
  id: ActionClearNetworkLinkOverlays
  name: Скрыть сетевые связи
  description: Скрыть подсветку сетевых соединений.
  components:
  - type: InstantAction
    clientExclusive: true
    checkCanInteract: false
    checkConsciousness: false
    temporary: true
    icon: { sprite: Objects/Tools/multitool.rsi, state: icon }
    event: !type:ClearAllOverlaysEvent

- type: entity
  id: ActionAnimalLayEgg
  name: Отложить яйцо
  description: Отложить яйцо, потратив запас сытости.
  components:
  - type: InstantAction
    icon: { sprite: Objects/Consumable/Food/egg.rsi, state: icon }
    useDelay: 60
    event: !type:EggLayInstantActionEvent

- type: entity
  id: ActionSleep
  name: Уснуть
  description: Лечь спать.
  components:
  - type: InstantAction
    checkCanInteract: false
    checkConsciousness: false
    icon: { sprite: Clothing/Head/Hats/pyjamasyndicatered.rsi, state: icon }
    event: !type:SleepActionEvent

- type: entity
  id: ActionWake
  name: Проснуться
  description: Перестать спать.
  components:
  - type: InstantAction
    icon: { sprite: Clothing/Head/Hats/pyjamasyndicatered.rsi, state: icon }
    checkCanInteract: false
    checkConsciousness: false
    event: !type:WakeActionEvent
    startDelay: true
    useDelay: 2

- type: entity
  id: ActionActivateHonkImplant
  name: Хонкнуть
  description: Активировать имплант, который издаст фирменный звук клоуна.
  components:
  - type: InstantAction
    icon: { sprite: Objects/Fun/bikehorn.rsi, state: icon }
    event: !type:ActivateImplantEvent
    useDelay: 1

- type: entity
  id: ActionFireStarter
  name: Поджечь
  description: Поджечь врагов вокруг себя.
  components:
  - type: InstantAction
    priority: -1
    useDelay: 30
    icon: Interface/Actions/firestarter.png
    event: !type:FireStarterActionEvent

- type: entity
  id: ActionToggleEyes
  name: Открыть или закрыть глаза
  description: Закрыть глаза, чтобы защитить их, или открыть, чтобы снова видеть.
  components:
  - type: InstantAction
    icon: Interface/Actions/eyeopen.png
    iconOn: Interface/Actions/eyeclose.png
    event: !type:ToggleEyesActionEvent
    useDelay: 1 # so u cant give yourself and observers eyestrain by rapidly spamming the action
    checkCanInteract: false
    checkConsciousness: false

- type: entity
  id: ActionToggleWagging
  name: Вилять хвостом
  description: Начать или перестать вилять хвостом.
  components:
    - type: InstantAction
      icon: { sprite: Mobs/Customization/reptilian_parts.rsi, state: tail_smooth_behind }
      iconOn: { sprite: Mobs/Customization/reptilian_parts.rsi, state: tail_smooth_behind }
      itemIconStyle: NoItem
      useDelay: 1 # emote spam
      event: !type:ToggleActionEvent

- type: entity
  id: FakeMindShieldToggleAction
  name: '[color=green]Переключить поддельный щит разума[/color]'
  description: Включить или выключить сигнал поддельного импланта «Щит разума».
  components:
  - type: InstantAction
    icon: { sprite: Interface/Actions/actions_fakemindshield.rsi, state: icon }
    iconOn: { sprite: Interface/Actions/actions_fakemindshield.rsi, state: icon-on }
    itemIconStyle: NoItem
    useDelay: 1
    event: !type:FakeMindShieldToggleEvent

- type: entity
  id: ActionToggleParamedicSiren
  name: Переключить сирену парамедика
  description: Включить или выключить сирену парамедика.
  components:
  - type: InstantAction 
    icon:
      sprite: Clothing/OuterClothing/Hardsuits/paramed.rsi
      state: icon-siren
    useDelay: 1
    itemIconStyle: BigAction
    event: !type:ToggleActionEvent
