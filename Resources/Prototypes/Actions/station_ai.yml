- type: entity
  parent: BaseAction
  id: ActionJumpToCore
  name: Вернуться к ядру
  description: Переместить ваше око обратно к ядру.
  components:
  - type: Action
    priority: -9
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Interface/Actions/actions_ai.rsi
    layers:
    - state: ai_core
  - type: InstantAction
    event: !type:JumpToCoreEvent ''
- type: entity
  parent: BaseMentalAction
  id: ActionAIViewLaws
  name: Посмотреть законы
  description: Показать законы, которым вы обязаны подчиняться.
  components:
  - type: Action
    priority: -3
    itemIconStyle: NoItem
    useDelay: 0.5
  - type: Sprite
    sprite: Interface/Actions/actions_ai.rsi
    layers:
    - state: state_laws
  - type: InstantAction
    event: !type:ToggleLawsScreenEvent ''
