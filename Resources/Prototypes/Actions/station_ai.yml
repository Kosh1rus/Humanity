# Actions
- type: entity
  id: ActionJumpToCore
  name: Вернуться к ядру
  description: Переместить ваше око обратно к ядру.
  components:
  - type: InstantAction
    priority: -9
    itemIconStyle: BigAction
    icon:
      sprite: Interface/Actions/actions_ai.rsi
      state: ai_core
    event: !type:JumpToCoreEvent

- type: entity
  id: ActionSurvCameraLights
  name: Переключить подсветку камер
  description: Включить или выключить подсветку камер наблюдения рядом с точкой обзора.
  components:
  - type: InstantAction
    priority: -5
    itemIconStyle: BigAction
    icon:
      sprite: Interface/Actions/actions_ai.rsi
      state: camera_light
    event: !type:RelayedActionComponentChangeEvent
      components:
      - type: LightOnCollideCollider
      - type: FixturesChange
        fixtures:
          lightTrigger:
            shape:
              !type:PhysShapeCircle
              radius: 0.35
            density: 80
            hard: false
            layer:
            - GhostImpassable


- type: entity
  id: ActionAIViewLaws
  name: Посмотреть законы
  description: Показать законы, которым вы обязаны подчиняться.
  components:
  - type: InstantAction
    checkCanInteract: false
    checkConsciousness: false
    priority: -3
    itemIconStyle: NoItem
    icon:
      sprite: Interface/Actions/actions_ai.rsi
      state: state_laws
    event: !type:ToggleLawsScreenEvent
    useDelay: 0.5
