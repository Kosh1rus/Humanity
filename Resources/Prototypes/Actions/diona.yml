- type: entity
  parent: BaseSuicideAction
  id: DionaGibAction
  name: Разделиться!
  description: Распасться на трёх нимф.
  components:
  - type: Action
  - type: Sprite
    sprite: Mobs/Species/Diona/organs.rsi
    layers:
    - state: brain
  - type: InstantAction
    event: !type:GibActionEvent {}
- type: entity
  parent: BaseAction
  id: DionaReformAction
  name: Собраться вновь
  description: Соединиться и снова стать цельной дионой.
  components:
  - type: Action
    useDelay: 600
  - type: Sprite
    sprite: Mobs/Species/Diona/parts.rsi
    layers:
    - state: full
  - type: InstantAction
    event: !type:ReformEvent {}
