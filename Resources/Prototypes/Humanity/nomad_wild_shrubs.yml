- type: entity
  id: HumanityWildShrubBase
  parent: WildPlantBase
  abstract: true
  name: дикий куст
  description: Можно собрать ветки пустой рукой.
  components:
  - type: Sprite
    sprite: Civ14/Flora/bushes_temperate.rsi
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.35,-0.4,0.35,0.4"
        hard: false
  - type: Gatherable
    toolWhitelist:
      components:
      - Hands
    loot:
      All: !type:NestedSelector
        tableId: HumanityWildShrubHarvest

- type: entityTable
