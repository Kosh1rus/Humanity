- type: entity
  parent:
  - SeatBase
  - BaseDeployFoldable
  - StructureHealthFurniture
  id: ChairFolding
  name: складной стул
  description: Возьмите с собой шесть таких — и станете самым подготовленным гостем на любом собрании.
  components:
  - type: Rotatable
  - type: Sprite
    sprite: Structures/Furniture/folding_chair.rsi
    layers:
    - state: folding
      map:
      - unfoldedLayer
    - state: folding_folded
      map:
      - foldedLayer
      visible: false
  - type: Item
    size: Huge
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 8
    soundHit:
      collection: MetalThud
  - type: Construction
    graph: Seat
    node: chairFolding
  - type: DamageExaminable
  - type: Damageable
    damageModifierSet: PlasticMod
  - type: Destructible
    thresholds:
    - trigger: *id002
      behaviors:
      - *id003
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPlastic1: *id004
          PartRodMetal1: *id004
  - type: STWeight
    self: 8
- type: entity
  parent: ChairFolding
  id: ChairFoldingSpawnFolded
  suffix: folded
  components:
