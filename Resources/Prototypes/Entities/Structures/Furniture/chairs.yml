- type: entity
  abstract: true
  id: SeatBase
  name: chair
  description: You sit in this. Either by will or force.
  placement:
    mode: PlaceFree
  components:
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Dynamic
  - type: GravityAffected
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.2
        density: 100
        mask:
        - TableMask
  - type: Sprite
    sprite: Structures/Furniture/chairs.rsi
    noRot: true
  - type: Strap
    position: Stand
    buckleOffset: 0,-0.05
  - type: Pullable
  - type: StaticPrice
    price: 50
- type: entity
  abstract: true
  parent: SeatBase
  id: UnanchoredChairBase
  name: chair
  components:
  - type: Anchorable
  - type: Rotatable
- type: entity
  abstract: true
  parent: UnanchoredChairBase
  id: ChairBase
  name: chair
  placement:
    mode: SnapgridCenter
  components:
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true
- type: entity
  abstract: true
  parent: UnanchoredChairBase
  id: OfficeChairBase
  name: chair
  components:
  - type: Rotatable
    rotateWhileAnchored: true
- type: entity
  abstract: true
  parent:
  - OfficeChairBase
  - BaseVehicleStrap
  id: OfficeChairVehicleBase
  components:
  - type: Physics
    bodyType: KinematicController
  - type: Vehicle
    requiresHands: false
  - type: MovementSpeedModifier
    baseAcceleration: 2
    baseFriction: 2
    baseWalkSpeed: 2
    baseSprintSpeed: 3
- type: entity
  abstract: true
  parent: OfficeChairBase
  id: StoolBase
  name: stool
  components:
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true
- type: entity
  parent:
  - ChairBase
  - StructureHealthFurniture
  id: Chair
  name: стул
  components:
  - type: Sprite
    state: chair
  - type: Construction
    graph: Seat
    node: chair
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Destructible
    thresholds: &id001
    - trigger: &id002 !type:DamageTrigger
        damage: 40
      behaviors:
      - &id003 !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1: &id004
            min: 0
            max: 1
