- type: entity
  id: RollerBed
  parent:
  - BaseItem
  - BaseDeployFoldable
  name: rollerbed
  description: Used to carry patients around without damaging them.
  components:
  - type: Transform
    noRot: true
  - type: Item
    size: Normal
    heldPrefix: rollerbed
  - type: Sprite
    sprite: Structures/Furniture/rollerbeds.rsi
    noRot: true
    layers:
    - state: rollerbed
      map:
      - unfoldedLayer
    - state: rollerbed_folded
      map:
      - foldedLayer
      visible: false
    - state: rollerbed_buckled
      map:
      - buckledLayer
      visible: false
  - type: MovedByPressure
  - type: DamageOnHighSpeedImpact
    soundHit:
      collection: MetalThud
  - type: InteractionOutline
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.35
        density: 20
        mask:
        - MobMask
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts:
        - Destruction
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 1
  - type: Pullable
  - type: Strap
    position: Down
    rotation: -90
    buckleOffset: 0,0.15
    buckleOnInteractHand: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.StrapVisuals.State:
        buckledLayer:
          true:
            visible: true
          false:
            visible: false
        unfoldedLayer:
          true:
            visible: false
          false:
            visible: true
      enum.FoldedVisuals.State:
        foldedLayer:
          true:
            visible: true
          false:
            visible: false
        unfoldedLayer:
          true:
            visible: false
  - type: StaticPrice
    price: 120
  - type: STWeight
    self: 3
- type: entity
  parent: RollerBed
  id: RollerBedSpawnFolded
  suffix: folded
  components:
  - type: Foldable
    folded: true
  - type: Strap
    enabled: false
- type: entity
  id: CheapRollerBed
  name: каталка
  parent: RollerBed
  description: На ней перевозят пациентов.
  components:
  - type: Item
    heldPrefix: cheap_rollerbed
  - type: Sprite
    layers:
    - state: cheap_rollerbed
      map:
      - unfoldedLayer
    - state: cheap_rollerbed_folded
      map:
      - foldedLayer
      visible: false
    - state: cheap_rollerbed_buckled
      map:
      - buckledLayer
      visible: false
- type: entity
  parent: CheapRollerBed
  id: CheapRollerBedSpawnFolded
  suffix: folded
  components:
  - type: Foldable
    folded: true
  - type: Strap
    enabled: false
- type: entity
  id: EmergencyRollerBed
  name: rollerbed
  parent: RollerBed
  description: A robust looking rollerbed used for emergencies.
  components:
  - type: Item
    heldPrefix: emergency_rollerbed
  - type: Sprite
    layers:
    - state: emergency_rollerbed
      map:
      - unfoldedLayer
    - state: emergency_rollerbed_folded
      map:
      - foldedLayer
      visible: false
    - state: emergency_rollerbed_buckled
      map:
      - buckledLayer
      visible: false
- type: entity
  parent: EmergencyRollerBed
  id: EmergencyRollerBedSpawnFolded
  suffix: folded
  components:
  - type: Foldable
    folded: true
  - type: Strap
    enabled: false
