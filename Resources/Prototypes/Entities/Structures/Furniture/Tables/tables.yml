- type: entity
  parent:
  - BaseStructure
  - StructureHealthFurnitureWeak
  id: TableFrame
  name: table frame
  description: Pieces of metal that make the frame of a table.
  components:
  - type: Sprite
    sprite: Structures/Furniture/Tables/frame.rsi
  - type: Icon
    sprite: Structures/Furniture/Tables/frame.rsi
    state: full
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: -0.40,-0.30,0.40,0.45
        density: 80
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: IconSmooth
    key: tableframe
    states:
    - !type:CornerSpriteSmoothing
      mask:
      - tableframe
      base: state_
  - type: Damageable
    damageModifierSet: RodMetalMod
  - type: Destructible
    thresholds:
    - trigger: &id001 !type:DamageTrigger
        damage: 5
      behaviors:
      - &id002 !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          PartRodMetal1:
            min: 1
            max: 1
  - type: Construction
    graph: Table
    node: TableFrame
- type: entity
  parent:
