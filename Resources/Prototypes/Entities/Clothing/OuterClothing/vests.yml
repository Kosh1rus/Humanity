- type: entity
  parent: ClothingOuterStorageBase
  id: ClothingOuterVestHazard
  name: hi-viz vest
  description: A high-visibility vest used in work zones.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Vests/hazard.rsi
    layers:
    - state: icon
    - state: icon-unshaded
      shader: unshaded
    - state: icon-unshaded
      shader: shaded
  - type: Clothing
    sprite: Clothing/OuterClothing/Vests/hazard.rsi
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING
      - state: equipped-OUTERCLOTHING-unshaded
        shader: unshaded
      - state: equipped-OUTERCLOTHING-unshaded
        shader: shaded
  - type: Reflect
    reflectProb: 0.02
    reflects:
    - Energy
    reflectingInHands: false
  - type: Tag
    tags:
    - HiViz
    - WhitelistChameleon
- type: entity
  parent: ClothingOuterBase
  id: ClothingOuterVest
  name: vest
  description: A thick vest with a rubbery, water-resistant shell.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Vests/vest.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Vests/vest.rsi
- type: entity
  parent:
  - ClothingOuterBase
  - AllowSuitStorageClothingGasTanks
  id: ClothingOuterVestTank
  name: tank harness
  description: A simple harness that can hold a gas tank.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Vests/tankharness.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Vests/tankharness.rsi
  - type: Item
    size: Normal
    shape:
    - 0, 0, 0, 1
- type: entity
  parent:
  - ClothingOuterBase
  - AllowSuitStorageClothingGasTanks
  id: ClothingOuterVestPress
  name: press vest
  description: A cloth vest for the fearless reporter in the field. Go land an interview with that space dragon!
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Vests/pressvest.rsi
    layers:
    - state: icon
    - state: icon-unshaded
      shader: unshaded
    - state: icon-unshaded
      shader: shaded
  - type: Clothing
    sprite: Clothing/OuterClothing/Vests/pressvest.rsi
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING
      - state: equipped-OUTERCLOTHING-unshaded
        shader: unshaded
      - state: equipped-OUTERCLOTHING-unshaded
        shader: shaded
  - type: Armor
    modifiers:
      coefficients:
        Piercing: 0.99
