- type: entity
  parent:
  - ClothingShoesBase
  - BaseToggleClothing
  id: ClothingShoesBootsMagBase
  name: magboots
  description: Magnetic boots, often used during extravehicular activity to ensure the user remains safely attached to the
    vehicle.
  abstract: true
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Boots/magboots.rsi
    layers:
    - state: icon
      map:
      - enum.ToggleableVisuals.Layer
  - type: Clothing
    sprite: Clothing/Shoes/Boots/magboots.rsi
  - type: ToggleClothing
    action: ActionToggleMagboots
    mustEquip: false
  - type: ComponentToggler
    components:
    - type: NoSlip
  - type: ItemTogglePrefix
    prefixOn: "on"
  - type: ToggleClothingPrefix
    prefixOn: "on"
  - type: Magboots
  - type: ClothingSpeedModifier
    walkModifier: 0.8
    sprintModifier: 0.8
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          true:
            state: icon-on
          false:
            state: icon
  - type: StaticPrice
    price: 200
  - type: Tag
    tags:
    - WhitelistChameleon
- type: entity
  parent:
  - ClothingShoesBootsMagBase
  id: ClothingShoesBootsMag
- type: entity
  parent:
  - ClothingShoesBootsMagBase
  id: ClothingShoesBootsMagAdv
  name: advanced magboots
  description: State-of-the-art magnetic boots that do not slow down their wearer.
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Boots/magboots-advanced.rsi
    state: icon
  - type: Clothing
    sprite: Clothing/Shoes/Boots/magboots-advanced.rsi
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 1
  - type: Tag
    tags:
    - WhitelistChameleon
    - HighRiskItem
  - type: StaticPrice
    price: 750
  - type: StealTarget
    stealGroup:
    - ClothingShoesBootsMagAdv
- type: entity
  parent:
  - ClothingShoesBootsMagBase
  id: ClothingShoesBootsMagSci
