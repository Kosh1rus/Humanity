- type: entity
  abstract: true
  parent: BaseItem
  id: Clothing
  components:
  - type: STWeight
    self: 1.5
  - type: Item
    size: Normal
  - type: Sprite
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: StaticPrice
    price: 10
  - type: FlavorProfile
    flavors:
    - fiber
  - type: BurnFuel
    burnTime: 2
- type: entity
  abstract: true
  id: GeigerCounterClothing
  components:
  - type: Geiger
    attachedToSuit: true
- type: entity
  abstract: true
  id: AllowSuitStorageClothing
  components:
  - type: AllowSuitStorage
- type: entity
  abstract: true
  id: AllowSuitStorageClothingGasTanks
  components:
  - type: AllowSuitStorage
    whitelist:
      components:
      - GasTank
- type: entity
  abstract: true
  id: ClothingSlotBase
  components:
  - type: ItemSlots
    allowSmartEquip: true
  - type: ContainerContainer
    containers:
      item: !type:ContainerSlot ''
- type: entity
  abstract: true
  id: ContentsExplosionResistanceBase
  components:
  - type: ExplosionResistance
    worn: false
    examine: explosion-resistance-contents-coefficient-value
  - type: GroupExamine
  - type: Armor
    modifiers: {}
- type: entity
  abstract: true
  id: BaseToggleClothing
  components:
  - type: ItemToggle
    onUse: false
  - type: ToggleClothing
- type: entity
  abstract: true
  id: TemperatureProtectionMinimal
  components:
  - type: TemperatureProtection
    coefficient: 0.8
- type: entity
  abstract: true
  id: TemperatureProtection
  components:
  - type: TemperatureProtection
    coefficient: 0.6
- type: entity
  abstract: true
  id: TemperatureProtectionGood
  components:
  - type: TemperatureProtection
    coefficient: 0.05
- type: entity
  abstract: true
  id: TemperatureProtectionGreat
  components:
  - type: TemperatureProtection
    coefficient: 0.01
