- type: entity
  id: PowerSink
  parent:
  - BaseMachine
  - BaseSyndicateContraband
  - BaseMachineDestructible
  name: power sink
  description: Drains immense amounts of electricity from the grid.
  components:
  - type: Item
    size: Huge
  - type: MultiHandedItem
  - type: HeldSpeedModifier
    walkModifier: 0.6
    sprintModifier: 0.6
  - type: NodeContainer
    examinable: true
    nodes:
      input: !type:CableDeviceNode
        nodeGroupID: HVPower
  - type: Transform
    anchored: true
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: -0.40,-0.40,0.40,0.40
        density: 90
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: PowerSink
  - type: Battery
    netsync: false
    maxCharge: 250000000
    pricePerJoule: 9.0e-06
  - type: ExaminableBattery
  - type: PowerConsumerBatteryCharger
  - type: PowerConsumer
    voltage: High
    drawRate: 10000000
  - type: Sprite
    sprite: Objects/Power/powersink.rsi
    state: powersink
  - type: WarpPoint
    location: location-powersink
  - type: StaticPrice
    price: 3000
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 175
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: STWeight
    self: 8
