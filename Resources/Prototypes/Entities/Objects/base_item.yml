- type: entity
  abstract: true
  id: BaseItem
  name: item
  components:
  - type: Item
    size: Small
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: -0.25,-0.25,0.25,0.25
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    drawdepth: Items
    noRot: false
  - type: Pullable
  - type: DamageExaminable
  - type: Rotatable
    increment: 30
  - type: STWeight
    self: 0.15
- type: entity
  abstract: true
  id: BaseItemDestructible
  components:
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts:
        - Destruction
- type: entity
  name: storage item
  id: BaseStorageItem
  parent: BaseItem
  abstract: true
  components:
  - type: Storage
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
- type: entity
  id: BaseBagOpenClose
  abstract: true
  components:
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.SharedBagOpenVisuals.BagState:
        closeLayer:
          Open:
            visible: false
          Closed:
            visible: true
        openLayer:
          Open:
            visible: true
          Closed:
            visible: false
- type: entity
  id: BasePaperLabelable
  abstract: true
  components:
  - type: ContainerContainer
    containers:
      paper_label: !type:ContainerSlot ''
  - type: ItemSlots
  - type: PaperLabel
    labelSlot:
      insertVerbText: comp-paper-label-insert
      ejectVerbText: comp-paper-label-eject
      whitelist:
        components:
        - Paper
      blacklist:
        tags:
        - Book
- type: entity
  parent: BasePaperLabelable
  id: BasePaperLabelableVisualized
  abstract: true
  components:
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PaperLabelVisuals.HasLabel:
        enum.PaperLabelVisuals.Layer:
          true:
            visible: true
          false:
            visible: false
      enum.PaperLabelVisuals.LabelType:
        enum.PaperLabelVisuals.Layer:
          Paper:
            state: paper
          Bounty:
            state: bounty
          CaptainsPaper:
            state: captains_paper
          Invoice:
            state: invoice
- type: entity
  id: PowerCellSlotSmallItem
  abstract: true
  components:
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot {}
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellSmall
- type: entity
  id: PowerCellSlotMediumItem
  abstract: true
  components:
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot {}
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
- type: entity
  id: PowerCellSlotHighItem
  abstract: true
  components:
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot {}
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHigh
- type: entity
  abstract: true
  id: BaseSlicingRefinable
  components:
  - type: ToolRefinable
    qualityNeeded: Slicing
    verbText: refined-slice-verb-name
    verbDefaultTooltip: refined-slice-verb-message-default
    toolMissingQualityTooltip: refined-slice-verb-message-tool
    startRefinePopupType: small
    popupForUser: refined-butchered-success
    popupForOther: refined-butchered-success-others
    tooltipQualityHint: tool-refinable-component-hint-slicing
    verbIcon: Interface/VerbIcons/cutlery.svg.192dpi.png
    sound: !type:SoundPathSpecifier
      path: /Audio/Items/Culinary/chop.ogg
- type: entity
  abstract: true
  parent: BaseSlicingRefinable
  id: BaseSlicingRefinableFood
  components:
  - type: ToolRefinableSolution
- type: entity
  abstract: true
  parent: BaseSlicingRefinable
  id: BaseSlicingRefinableButchering
  components:
  - type: ToolRefinable
    verbText: refined-butchered-verb-name
    tooltipQualityHint: tool-refinable-component-hint-butchering
- type: entity
  abstract: true
  id: BaseScrewingRefinable
  components:
  - type: ToolRefinable
    qualityNeeded: Screwing
    verbText: refined-screw-verb-name
    verbIcon: Interface/VerbIcons/screwdriver.png
    verbDefaultTooltip: refined-screwed-verb-message-default
    toolMissingQualityTooltip: refined-screwed-verb-message-tool
    popupForUser: refined-screwed-success
    popupForOther: refined-screwed-success-others
    tooltipQualityHint: tool-refinable-component-hint-screwing
- type: entity
  abstract: true
  id: BaseStash
  components:
  - type: SecretStash
    blacklist:
      components:
      - NukeDisk
      tags:
      - QuantumSpinInverter
      - FakeNukeDisk
  - type: ToolOpenable
    openToolQualityNeeded: Slicing
    closeToolQualityNeeded: Slicing
  - type: ContainerContainer
    containers:
      stash: !type:ContainerSlot {}
- type: entity
  abstract: true
  parent: BaseStash
  id: BaseStashPlushie
  components:
  - type: Speech
    speechVerb: Default
  - type: SecretStash
    secretStashName: secret-stash-plushie
  - type: ToolOpenable
    name: secret-stash-plushie
- type: entity
  abstract: true
  parent: BaseStash
  id: BaseStashCake
  components:
  - type: SecretStash
    secretStashName: secret-stash-cake
    damageEatenItemInside:
      types:
        Slash: 7.5
  - type: ToolOpenable
    verbOnly: true
