- type: entity
  parent:
  - BaseItem
  - BaseSyndicateContraband
  id: ChameleonProjectorNoBattery
  name: chameleon projector
  description: Holoparasite technology used to create a hard-light replica of any object around you. Disguise is destroyed
    when picked up or deactivated.
  components:
  - type: Sprite
    sprite: /Textures/Objects/Devices/chameleon_projector.rsi
    layers:
    - state: icon
    - state: powered
      map:
      - enum.PowerDeviceVisualLayers.Powered
    - state: decharging
      map:
      - enum.PowerDeviceVisualLayers.Charging
      visible: false
  - type: ChameleonProjector
    whitelist:
      components:
      - Anchorable
      - Item
      tags:
      - Bot
    blacklist:
      components:
      - ChameleonDisguise
      - Door
      - MindContainer
      - Pda
      - SubFloorHide
      - Wall
      tags:
      - Catwalk
      - Window
    disguiseProto: ChameleonDisguise
  - type: StaticPrice
    price: 5000
- type: entity
  parent: ChameleonProjectorNoBattery
  id: ChameleonProjector
  name: chameleon projector
  description: Holoparasite technology used to create a hard-light replica of any object around you. Disguise is destroyed
    when picked up or deactivated.
  suffix: Battery
  components:
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.BatteryVisuals.State:
        enum.PowerDeviceVisualLayers.Powered:
          Full:
            visible: true
          Neither:
            visible: true
          Empty:
            visible: false
      enum.BatteryVisuals.Charging:
        enum.PowerDeviceVisualLayers.Charging:
          Charging:
            visible: false
          Decharging:
            visible: true
          Constant:
            visible: false
  - type: BatteryVisuals
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot ''
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: PowerCellDraw
    drawRate: 4
  - type: ToggleCellDraw
  - type: ItemToggle
    onActivate: false
    onUse: false
- type: entity
  categories:
  - HideSpawnMenu
  id: ChameleonDisguise
  name: Urist McKleiner
  components:
  - type: Sprite
    sprite: /Textures/Mobs/Species/Human/parts.rsi
    state: full
  - type: Transform
    noRot: true
  - type: InteractionOutline
  - type: Clickable
  - type: Damageable
  - type: Injurable
  - type: ChameleonDisguise
- type: entity
  parent: BaseAction
  id: ActionDisguiseNoRot
  name: Toggle Rotation
  description: Use this to prevent your disguise from rotating, making it easier to hide in some scenarios.
  components:
  - type: Action
    itemIconStyle: BigAction
  - type: Sprite
    layers:
    - texture: Interface/VerbIcons/refresh.svg.192dpi.png
  - type: InstantAction
    event: !type:DisguiseToggleNoRotEvent ''
- type: entity
  parent: BaseAction
  id: ActionDisguiseAnchor
  name: Toggle Anchored
  description: For many objects you will want to be anchored to not be completely obvious.
  components:
  - type: Action
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Objects/Tools/wrench.rsi
    layers:
    - state: icon
  - type: InstantAction
    event: !type:DisguiseToggleAnchoredEvent ''
