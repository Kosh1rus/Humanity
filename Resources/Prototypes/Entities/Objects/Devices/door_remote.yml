- type: entity
  parent: BaseItem
  id: DoorRemoteDefault
  name: door remote
  description: A gadget which can open and bolt doors remotely.
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Devices/door_remote.rsi
  - type: Item
    storedRotation: -90
  - type: Access
  - type: DoorRemote
    options:
    - mode: OpenClose
      tooltip: door-remote-open-close-text
      icon: &id001
        sprite: /Textures/Structures/Doors/Airlocks/Standard/airlock-base.rsi
        state: assembly
    - mode: ToggleBolts
      tooltip: door-remote-toggle-bolt-text
      icon: &id002
        sprite: /Textures/Interface/Actions/actions_ai.rsi
        state: bolt_door
    - mode: ToggleEmergencyAccess
      tooltip: door-remote-emergency-access-text
      icon: &id003
        sprite: /Textures/Interface/Actions/actions_ai.rsi
        state: emergency_on
  - type: StealTarget
    stealGroup:
    - DoorRemote
  - type: ActivatableUI
    inHandsOnly: true
    key: enum.DoorRemoteUiKey.Key
  - type: UserInterface
    interfaces:
      enum.DoorRemoteUiKey.Key:
        type: DoorRemoteBoundUserInterface
- type: entity
  parent: DoorRemoteDefault
  id: DoorRemoteCanEletrifyDoors
  abstract: true
  components:
  - type: DoorRemote
    options:
    - mode: ToggleOvercharge
      tooltip: door-remote-toggle-eletrify-text
      icon:
        sprite: /Textures/Interface/Actions/actions_ai.rsi
        state: door_overcharge_on
    - mode: OpenClose
      tooltip: door-remote-open-close-text
      icon: *id001
    - mode: ToggleBolts
      tooltip: door-remote-toggle-bolt-text
      icon: *id002
    - mode: ToggleEmergencyAccess
      tooltip: door-remote-emergency-access-text
      icon: *id003
- type: entity
  parent:
  - DoorRemoteDefault
  id: DoorRemoteCommand
  name: command door remote
  components:
  - type: Sprite
    layers:
    - state: door_remotebase
    - state: door_remotelightscolour
      color: '#e6e600'
    - state: door_remotescreencolour
      color: '#9f9f00'
  - type: Access
    groups:
    - Command
  - type: DoorRemote
- type: entity
  parent:
  - DoorRemoteDefault
  - BaseCommandContraband
  id: DoorRemoteCustom
  name: custom door remote
  description: A gadget which can open and bolt doors remotely. This advanced variant does not have built-in access, instead
    inheriting the ID access of the user.
  components:
  - type: Sprite
    layers:
    - state: door_remotebase
    - state: door_remotelightscolour
      color: '#0077FF'
    - state: door_remotescreencolour
      color: '#0033EE'
  - type: Access
  - type: DoorRemote
    includeUserAccess: true
- type: entity
  parent:
  - DoorRemoteCanEletrifyDoors
  - BaseCommandContraband
  id: DoorRemoteAll
  name: super door remote
  description: A gadget which can open and bolt doors remotely. This one works even on wooden doors!
  suffix: Admeme
  components:
  - type: Sprite
    layers:
    - state: door_remotebase
    - state: door_remotelightscolour
      color: '#2eba22'
    - state: door_remotescreencolour
      color: '#22871a'
  - type: DoorRemote
    includeUserAccess: true
    requireInRangeUnoccluded: false
    requireTagWhitelist: false
  - type: Access
    groups:
    - AllAccess
    tags:
    - CentralCommand
    - NuclearOperative
    - SyndicateAgent
    - Wizard
    - Xenoborg
- type: entity
  parent:
  - DoorRemoteCanEletrifyDoors
  - BaseXenoborgContraband
  id: DoorRemoteXenoborg
  name: xenoborg door remote
  components:
  - type: Sprite
    layers:
    - state: door_remotebase
    - state: door_remotelightscolour
      color: '#2eba22'
    - state: door_remotescreencolour
      color: '#22871a'
  - type: Access
    tags:
    - Xenoborg
