- type: entity
  parent: BaseItem
  id: RehydratableItem
  abstract: true
  components:
  - type: Item
    size: Tiny
  - type: SolutionManager
    solutions:
    - SolutionCube
  - type: RefillableSolution
    solution: cube
  - type: DrawableSolution
    solution: cube
  - type: InjectableSolution
    solution: cube
  - type: Reactive
    reactions:
    - reagents:
      - Water
      methods:
      - Touch
      - Ingestion
      - Injection
      effects:
      - !type:AddReagentToSolution
        reagent: Water
        solution: cube
  - type: Rehydratable
  - type: CollisionWake
    enabled: false
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: -0.3,-0.3,0.3,0.3
        density: 5
        mask:
        - ItemMask
      rehydrate:
        shape: !type:PhysShapeAabb
          bounds: -0.3,-0.3,0.3,0.3
        hard: false
        layer:
        - LowImpassable
- type: entity
  parent: Solution
  id: SolutionCube
  name: cube
  description: if you're reading this, nuh uh! file a bug report.
  categories:
  - HideSpawnMenu
  components:
  - type: Solution
    id: cube
    solution:
      maxVol: 1
- type: entity
  abstract: true
  parent:
  - SolutionTiny
  - SolutionFood
  - RehydratableItem
  id: RehydratableAnimalCube
  description: Just add water!
  components:
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi
    state: cube
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 5
      - ReagentId: UncookedAnimalProteins
        Quantity: 20
      - ReagentId: Fat
        Quantity: 5
  - type: Edible
  - type: FlavorProfile
    flavors:
    - chewy
    - horrible
    - compressed-meat
  - type: Tag
    tags:
    - Meat
- type: entity
  parent: RehydratableAnimalCube
  id: MonkeyCube
  name: monkey cube
  components:
  - type: Rehydratable
    possibleSpawns:
    - MobMonkey
  - type: Tag
    tags:
    - Meat
    - MonkeyCube
  - type: STWeight
    self: 0.75
