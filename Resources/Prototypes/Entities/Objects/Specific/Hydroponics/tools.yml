- type: entity
  name: "мотыжка"
  parent: BaseItem
  id: HydroponicsToolMiniHoe
  description: "Для прополки сорняков или чесания спины."
  components:
    - type: Tag
      tags:
        - Hoe
        - BotanyHoe
    - type: Sprite
      sprite: Objects/Tools/Hydroponics/hoe.rsi
      state: icon
    - type: MeleeWeapon
      wideAnimationRotation: 135
      swingLeft: true
      damage:
        types:
          Slash: 6
    - type: Item
      sprite: Objects/Tools/Hydroponics/hoe.rsi
    - type: Construction
      graph: Hoe
      node: end
      agemin: 0
      agemax: 8
- type: entity
  name: plant clippers
  parent: BaseItem
  id: HydroponicsToolClippers
  description: A tool used to take samples from plants.
  components:
    - type: Tag
      tags:
        - PlantSampleTaker
    - type: Sprite
      sprite: Objects/Tools/Hydroponics/clippers.rsi
      state: icon
    - type: MeleeWeapon
      wideAnimationRotation: 90
      damage:
        types:
          Slash: 7
    - type: Item
      sprite: Objects/Tools/Hydroponics/clippers.rsi
      storedRotation: -90

- type: entity
  name: "коса"
  parent: BaseItem
  id: HydroponicsToolScythe
  description: "Изогнутое лезвие на длинной рукояти. Помогает пожинать плоды своих трудов."
  components:
    - type: Sharp
    - type: Sprite
      sprite: Objects/Tools/Hydroponics/scythe.rsi
      state: icon
    - type: MeleeWeapon
      wideAnimationRotation: 135
      damage:
        types:
          Slash: 10
    - type: STWeight
      self: 3
    - type: Item
      size: Normal
    - type: Clothing
      sprite: Objects/Tools/Hydroponics/scythe.rsi
      slots:
        - back
    - type: StaticPrice
      price: 40

- type: entity
  name: "топорик"
  parent: BaseItem
  id: HydroponicsToolHatchet
  description: "Небольшой топор с очень острым лезвием. Рубить им можно что угодно, но обычно им рубят дрова."
  components:
    - type: Tag
      tags:
        - BotanyHatchet
    - type: Sharp
    - type: Sprite
      sprite: Objects/Tools/Hydroponics/hatchet.rsi
      state: icon
    - type: MeleeWeapon
      wideAnimationRotation: 135
      swingLeft: true
      damage:
        types:
          Slash: 8
          Piercing: 2
    - type: Item
      sprite: Objects/Tools/Hydroponics/hatchet.rsi

- type: entity
  name: spade
  parent: BaseItem
  id: HydroponicsToolSpade
  description: A small tool for digging and moving dirt.
  components:
    - type: Tag
      tags:
        - BotanyShovel
    - type: Sprite
      sprite: Objects/Tools/Hydroponics/spade.rsi
      state: icon
    - type: MeleeWeapon
      wideAnimationRotation: 45
      damage:
        types:
          Blunt: 8
          Piercing: 2 # I guess you can stab it into them?
      soundHit:
        collection: MetalThud
    - type: Item
      sprite: Objects/Tools/Hydroponics/spade.rsi
    - type: Shovel
      speedModifier: 0.75 # slower at digging than a full-sized shovel

- type: entity
  name: plant bag
  id: PlantBag
  parent: BaseStorageItem
  description: A bag for botanists to easily move their huge harvests.
  components:
    - type: Sprite
      sprite: Objects/Specific/Hydroponics/Equipment/plant_bag.rsi
      state: icon
    - type: Item
      storedRotation: -90
    - type: Clothing
      quickEquip: false
      slots:
        - belt
    - type: Storage
      grid:
        - 0,0,7,4
      maxItemSize: Small
      quickInsert: true
      areaInsert: true
      whitelist:
        components:
          - Produce
          - Seed
    - type: Dumpable
