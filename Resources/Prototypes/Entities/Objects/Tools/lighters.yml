      reagents:
      - ReagentId: Plasma
        Quantity: 15
- type: entity
  parent:
  - SolutionToolWelderExperimental
  - BaseBrandedLighter
  - BaseCentcommContraband
  id: CentCommFlippo
  name: Gilded CentComm Flippo
  description: An Ornate, jade embossed and gilded flippo frame containing a bluespace powered jet. The latch is secured by
    a miniature access reader that only responds to CentComm officials. The nicest lighter known to man.
  suffix: DO NOT MAP
  components:
  - type: Sprite
    sprite: Objects/Tools/Lighters/centcomm.rsi
  - type: Item
    sprite: Objects/Tools/Lighters/centcomm.rsi
  - type: ItemToggleRequiresLock
    requireLocked: false
  - type: Welder
    fuelConsumption: 0.0
    fuelLitCost: 10
    fuelReagent: Plasma
  - type: PointLight
    radius: 4
    color: Gold
  - type: Tool
    useSound:
      collection: Welder
    qualities:
    - Welding
  - type: Lock
  - type: AccessReader
    access:
    - - CentralCommand
- type: entity
  parent:
  - BaseBrandedLighter
  - BaseHighlyIllegalContraband
  id: SpiderclanFlippo
