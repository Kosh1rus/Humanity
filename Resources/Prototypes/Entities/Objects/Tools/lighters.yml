- type: entity
  abstract: true
  parent:
  - SolutionWelder
  - BaseItem
  id: BaseLighter
  name: basic lighter
  components:
  - type: IgnitionSource
    ignited: false
  - type: ItemToggleExaminableStatus
  - type: ItemToggle
    predictable: false
    soundActivate:
      collection: lighterOnSounds
    soundDeactivate:
      collection: lighterOffSounds
  - type: ItemToggleMeleeWeapon
    activatedDamage:
      types:
        Heat: 1
  - type: ItemToggleSize
    activatedSize: Small
  - type: ItemToggleHot
  - type: Appearance
  - type: Item
    size: Tiny
  - type: UseDelay
  - type: RefillableSolution
    solution: Welder
  - type: MeleeWeapon
    wideAnimationRotation: 180
    damage:
      types:
        Blunt: 0
  - type: Welder
    fuelConsumption: 0.01
    fuelLitCost: 0.1
    tankSafe: true
  - type: PointLight
    enabled: false
    netsync: false
    radius: 1.1
    color: orange
  - type: ItemTogglePointLight
  - type: PhysicalComposition
- type: entity
  abstract: true
  parent:
  - SolutionWelder
  - SolutionToolVeryTiny
  id: SolutionLighter
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 7.5
- type: entity
  parent:
  - SolutionLighter
  - BaseLighter
  id: Lighter
  name: basic lighter
  description: A simple plastic cigarette lighter.
  components:
  - type: Sprite
    sprite: Objects/Tools/Lighters/lighters.rsi
    layers:
    - state: icon_map
    - state: cheap_icon_base
      map:
      - skin
    - state: basic_icon_top
    - state: lighter_flame
      visible: false
      shader: unshaded
      map:
      - flame
  - type: RandomSprite
    available:
    - skin:
        basic_icon_base-1: ''
        basic_icon_base-2: ''
        basic_icon_base-3: ''
        basic_icon_base-4: ''
        basic_icon_base-5: ''
        basic_icon_base-6: ''
        basic_icon_base-7: ''
        basic_icon_base-8: ''
        basic_icon_base-9: ''
        basic_icon_base-10: ''
        basic_icon_base-11: ''
  - type: ToggleableVisuals
    spriteLayer: flame
    inhandVisuals:
      left:
      - state: inhand-left-flame
        shader: unshaded
      right:
      - state: inhand-right-flame
        shader: unshaded
  - type: Item
    sprite: Objects/Tools/Lighters/lighters.rsi
  - type: Cautery
    speed: 0.45
  - type: SurgeryTool
    startSound:
      collection: lighterOnSounds
    endSound:
      collection: lighterOffSounds
- type: entity
  parent: Lighter
  id: CheapLighter
  name: дешёвая зажигалка
  description: Подозрительно дешёвая пластиковая зажигалка. Берегите большой палец!
  components:
  - type: Sprite
    sprite: Objects/Tools/Lighters/lighters.rsi
    layers:
    - state: icon_map
    - state: cheap_icon_base
      map:
      - skin
    - state: cheap_icon_top
    - state: lighter_flame
      visible: false
      shader: unshaded
      map:
      - flame
  - type: RandomSprite
    available:
    - skin:
        cheap_icon_base: Rainbow
  - type: Welder
    fuelConsumption: 0.02
    fuelLitCost: 0.2
- type: entity
  parent:
  - SolutionLighter
  - BaseLighter
  id: DiscountDanLighter
  name: Discount Dan's lighter
  description: The worst lighter ever produced. Lighter burn is inevitable, do not refuel while lit.
  components:
  - type: Sprite
    sprite: Objects/Tools/Lighters/lighters.rsi
    layers:
    - state: icon_map
    - state: discount_icon_base
    - state: basic_icon_top
    - state: lighter_flame
      visible: false
      shader: unshaded
      map:
      - flame
  - type: Welder
    fuelConsumption: 0.4
    fuelLitCost: 0.2
    tankSafe: false
  - type: Item
    sprite: Objects/Tools/Lighters/lighters.rsi
  - type: ToggleableVisuals
    spriteLayer: flame
    inhandVisuals:
      left:
      - state: inhand-left-flame
        shader: unshaded
      right:
      - state: inhand-right-flame
        shader: unshaded
  - type: PointLight
    radius: 1.5
    color: yellow
  - type: ComponentToggler
    components:
    - type: DamageOnHolding
      damage:
        types:
          Heat: 2
- type: entity
  abstract: true
  parent:
  - SolutionToolWelderMini
  - BaseLighter
  id: BaseBrandedLighter
  components:
  - type: ItemToggle
    predictable: false
    soundActivate:
      path: /Audio/Items/Lighters/zippo_open.ogg
      params:
        volume: -5
    soundDeactivate:
      path: /Audio/Items/Lighters/zippo_close.ogg
      params:
        volume: -5
  - type: Sprite
    layers:
    - state: icon
      map:
      - base
    - state: top
      map:
      - top
      visible: false
    - state: open
      map:
      - open
      visible: false
    - state: flame
      map:
      - flame
      visible: false
      shader: unshaded
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        open:
          true:
            visible: true
          false:
            visible: false
        top:
          true:
            visible: true
          false:
            visible: false
        base:
          true:
            visible: false
          false:
            visible: true
  - type: ToggleableVisuals
    spriteLayer: flame
    inhandVisuals:
      left:
      - state: inhand-left-lit
        shader: unshaded
      right:
      - state: inhand-right-lit
        shader: unshaded
  - type: PointLight
    radius: 1.5
- type: entity
  parent: BaseBrandedLighter
  id: FlippoLighter
  name: зажигалка «Флиппо»
  description: Прочная металлическая зажигалка. Прослужит долго.
  components:
  - type: Sprite
    sprite: Objects/Tools/Lighters/lighters.rsi
    layers:
    - state: zippo_icon_base
      map:
      - base
    - state: zippo_top
      map:
      - top
      visible: false
    - state: zippo_open
      map:
      - open
      visible: false
    - state: lighter_flame
      map:
      - flame
      visible: false
      shader: unshaded
  - type: Item
    sprite: Objects/Tools/Lighters/lighters.rsi
    heldPrefix: zippo
  - type: ToggleableVisuals
    inhandVisuals:
      left:
      - state: zippo-inhand-left-flame
        shader: unshaded
      right:
      - state: zippo-inhand-right-flame
        shader: unshaded
  - type: STWeight
    self: 0.75
- type: entity
  parent: FlippoLighter
  id: FlippoEngravedLighter
  name: flippo engraved lighter
  description: A rugged golden lighter that lasts quite a while. Engravings serve no tactical advantage whatsoever.
  components:
  - type: Sprite
    sprite: Objects/Tools/Lighters/lighters.rsi
    layers:
    - state: zippo_engraved_icon_base
      map:
      - base
    - state: zippo_top
      map:
      - top
      visible: false
    - state: zippo_engraved_open
      map:
      - open
      visible: false
    - state: lighter_flame
      map:
      - flame
      visible: false
      shader: unshaded
  - type: StealTarget
    stealGroup:
    - FlippoEngravedLighter
