- type: entity
  parent: BaseBoardEntity
  id: CheckerBoard
  name: шашки
  description: Доска и шашки входят в комплект.
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/chessboard.rsi
    state: chessboard
  - type: TabletopGame
    boardName: tabletop-checkers-board-name
    size: 338, 274
    setup: !type:TabletopCheckerSetup
      boardPrototype: CheckerBoardTabletop
      prototypePieceWhite: CheckerPieceWhite
      prototypeCrownWhite: CheckerCrownWhite
      prototypePieceBlack: CheckerPieceBlack
      prototypeCrownBlack: CheckerCrownBlack
- type: entity
  id: CheckerBoardTabletop
  name: checkerboard
  parent: BaseBoardTabletop
  categories:
  - HideSpawnMenu
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/chessboard_tabletop.rsi
    state: chessboard_tabletop
- type: entity
  id: CheckerPieceWhite
  name: white checker piece
  parent: BaseTabletopPiece
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/checker_pieces.rsi
    state: w_checker_piece
- type: entity
  id: CheckerCrownWhite
  name: white checker crown
  parent: BaseTabletopPiece
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/checker_pieces.rsi
    state: w_checker_crown
- type: entity
  id: CheckerPieceBlack
  name: black checker piece
  parent: BaseTabletopPiece
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/checker_pieces.rsi
    state: b_checker_piece
- type: entity
  id: CheckerCrownBlack
  name: black checker crown
  parent: BaseTabletopPiece
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/checker_pieces.rsi
    state: b_checker_crown
