- type: entity
  parent: BaseItem
  id: UtensilBase
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Misc/utensils.rsi
  - type: Item
    sprite: Objects/Misc/utensils.rsi
  - type: SpaceGarbage
  - type: Tweezers
    speed: 0.2
  - type: SurgeryTool
    startSound:
      path: /Audio/_Shitmed/Medical/Surgery/retractor1.ogg
    endSound:
      path: /Audio/_Shitmed/Medical/Surgery/hemostat1.ogg
- type: entity
  parent: UtensilBase
  id: UtensilBasePlastic
  abstract: true
  components:
  - type: Utensil
    breakChance: 0.2
  - type: StaticPrice
    price: 0
  - type: Tag
    tags:
    - Dinnerware
    - Plastic
    - Trash
  - type: MeleeWeapon
    wideAnimationRotation: 180
    attackRate: 1.5
    damage:
      types:
        Blunt: 0
- type: entity
  parent: UtensilBase
  id: Fork
  name: вилка
  description: Столовый прибор. Отлично подходит, чтобы что-нибудь проткнуть.
  components:
  - type: Tag
    tags:
    - Dinnerware
    - Metal
  - type: Sprite
    state: fork
  - type: Utensil
    types:
    - Fork
  - type: MeleeWeapon
    wideAnimationRotation: 180
    attackRate: 1.5
    damage:
      types:
        Piercing: 5
- type: entity
  parent: UtensilBasePlastic
  id: ForkPlastic
  name: пластиковая вилка
  description: Столовый прибор. Отлично подходит, чтобы что-нибудь проткнуть.
  components:
  - type: Sprite
    state: plastic_fork
  - type: Utensil
    types:
    - Fork
- type: entity
  parent: UtensilBase
  id: Spoon
  name: spoon
  description: There is no spoon.
  components:
  - type: Tag
    tags:
    - Dinnerware
    - Metal
  - type: Sprite
    state: spoon
  - type: Item
    heldPrefix: spoon
  - type: Utensil
    types:
    - Spoon
  - type: MeleeWeapon
    wideAnimationRotation: 180
    attackRate: 1.5
    damage:
      types:
        Blunt: 1
  - type: Shovel
    speedModifier: 0.1
  - type: ReactionMixer
    mixMessage: spoon-mixing-success
    timeToMix: 0.5
    reactionTypes:
    - Stir
- type: entity
  parent: UtensilBasePlastic
  id: SpoonPlastic
  name: пластиковая ложка
  description: Ложки не существует.
  components:
  - type: Sprite
    state: plastic_spoon
  - type: Item
    heldPrefix: spoon
  - type: Utensil
    types:
    - Spoon
  - type: Shovel
    speedModifier: 0.1
  - type: ReactionMixer
    mixMessage: spoon-mixing-success
    timeToMix: 0.5
    reactionTypes:
    - Stir
- type: entity
  parent: UtensilBasePlastic
  id: KnifePlastic
  name: plastic knife
  description: That's not a knife. This is a knife.
  components:
  - type: Sprite
    state: plastic_knife
  - type: Utensil
    types:
    - Knife
  - type: Tag
    tags:
    - Dinnerware
    - Knife
    - Plastic
    - ToyKnife
    - Trash
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: -0.1,-0.375,0.1,0.375
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Tool
    speedModifier: 0.15
    qualities:
    - Slicing
- type: entity
  parent: UtensilBase
  id: BarSpoon
  name: bar spoon
  description: Your personal helper to mix drinks and changes lives.
  components:
  - type: Tag
    tags:
    - Metal
  - type: Sprite
    state: bar_spoon
  - type: Item
    heldPrefix: spoon
  - type: Utensil
    types:
    - Spoon
  - type: ReactionMixer
    mixMessage: spoon-mixing-success
    timeToMix: 0.5
    reactionTypes:
    - Stir
  - type: MeleeWeapon
    wideAnimationRotation: 180
    attackRate: 2
    damage:
      types:
        Blunt: 2
  - type: Shovel
    speedModifier: 0.05
