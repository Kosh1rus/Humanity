- type: entity
  suffix: Exploding
  parent: Pen
  id: PenExploding
  components:
  - type: TimerTrigger
    delay: 4
    examinable: false
  - type: Explosive
    explosionType: Default
    maxIntensity: 8
    intensitySlope: 5
    totalIntensity: 20
    canCreateVacuum: false
  - type: ActivateOnPaperOpened
  - type: ExplodeOnTrigger
    keysIn:
    - timer
  - type: TriggerOnUse
  - type: TriggerOnSignal
  - type: DeviceLinkSink
    ports:
    - Trigger
  - type: AddComponentsOnTrigger
    components:
    - type: EmbeddableProjectile
      offset: 0.3,0.0
      removalTime: 0.0
    - type: ThrowingAngle
      angle: 315
    - type: LandAtCursor
    - type: DamageOtherOnHit
      damage:
        types:
          Piercing: 3
- type: entity
  parent:
  - BaseItem
  id: PenExplodingBox
  name: exploding pen box
  description: A small box containing an exploding pen. Packaging disintegrates when opened, leaving no evidence behind.
  components:
  - type: STWeight
    self: 0.75
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: Objects/Storage/penbox.rsi
    state: exploding_pen
  - type: SpawnItemsOnUse
    items:
    - id: PenExploding
    sound:
      path: /Audio/Effects/unwrap.ogg
