- type: entity
  abstract: true
  parent:
  - BaseItem
  - BaseSecurityContraband
  id: BaseBola
  name: bola
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: Objects/Weapons/Throwable/bola.rsi
    state: icon
  - type: EmitSoundOnThrow
    sound: /Audio/Weapons/bolathrow.ogg
  - type: EmitSoundOnLand
    sound: /Audio/Effects/snap.ogg
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts:
        - Destruction
  - type: DamageOnLand
    damage:
      types:
        Blunt: 5
  - type: Ensnaring
    freeTime: 1.5
    breakoutTime: 2.0
    walkSpeed: 0.65
    sprintSpeed: 0.65
    staminaDamage: 0
    canThrowTrigger: true
    canMoveBreakout: true
    maxEnsnares: 1
  - type: LandAtCursor
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.4
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
- type: entity
  parent: BaseBola
  id: Bola
  name: makeshift bola
  description: A makeshift bola, cobbled together with some spare cuffs and metal. It doesn't look like it's going to stay
    together for very long.
  components:
  - type: Construction
    graph: Bola
    node: bola
  - type: STWeight
    self: 3
- type: entity
  parent: BaseBola
  id: SecurityBola
  name: tactical bola
  description: A bola, comprised of steel anchors linked together with a wire cable. Reliable and reusable.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Throwable/securitybola.rsi
    state: icon
  - type: DamageOnLand
    damage:
      types:
        Blunt: 0
  - type: Ensnaring
    freeTime: 2.0
    breakoutTime: 2.5
    walkSpeed: 0.65
    sprintSpeed: 0.65
    staminaDamage: 0
    canThrowTrigger: true
    canMoveBreakout: true
    maxEnsnares: 1
