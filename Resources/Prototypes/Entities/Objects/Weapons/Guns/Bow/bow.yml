- type: entity
  name: bow
  parent:
  - BaseItem
  - BaseMinorContraband
  id: BaseBow
  description: The original rooty tooty point and shooty.
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Bow/bow.rsi
  - type: STWeight
    self: 3
  - type: Item
    size: Normal
  - type: Clothing
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Wieldable
    wieldSound:
      path: /Audio/Items/bow_pull.ogg
  - type: UseDelay
    delay: 1
  - type: GunRequiresWield
  - type: Gun
    projectileSpeed: 30
    minAngle: 0
    maxAngle: 5
    fireRate: 1
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      collection: BulletMiss
    soundEmpty: null
  - type: ItemSlots
    slots:
      projectiles:
        name: Projectiles
        startingItem: null
        insertSound: /Audio/Weapons/Guns/Misc/arrow_nock.ogg
        whitelist:
          tags:
          - Arrow
          - Plunger
  - type: ContainerContainer
    containers:
      projectiles: !type:ContainerSlot ''
  - type: ContainerAmmoProvider
    container: projectiles
- type: entity
  id: BowImprovised
  parent: BaseBow
  name: improvised shortbow
  components:
  - type: Sprite
    layers:
    - state: unwielded
      map:
      - base
    - state: unwielded-arrow
      map:
      - arrow
      visible: false
    - state: unwielded-plunger
      map:
      - plunger
      visible: false
  - type: Appearance
  - type: ItemMapper
    spriteLayers:
    - arrow
    - plunger
    mapLayers:
      arrow:
        whitelist:
          tags:
          - Arrow
      plunger:
        whitelist:
          tags:
          - Plunger
  - type: GenericVisualizer
    visuals:
      enum.WieldableVisuals.Wielded:
        arrow:
          true:
            state: wielded-arrow
          false:
            state: unwielded-arrow
        plunger:
          true:
            state: wielded-plunger
          false:
            state: unwielded-plunger
        base:
          true:
            state: wielded
          false:
            state: unwielded
